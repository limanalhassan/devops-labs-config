name: devops-labs

# Customer-facing stack. Pulls prebuilt images from GHCR; no local build.
# To update: `docker compose pull && docker compose up -d`.

services:
  api:
    # Pin to major-version `0` by default. You get patch and minor
    # upgrades automatically with `docker compose pull`, never a surprise
    # major-version break. Switch to a hard pin like `0.1.3` for stricter
    # upgrade control.
    image: ghcr.io/limanalhassan/devops-labs-api:${DEVOPS_LABS_VERSION:-0}
    ports:
      - "127.0.0.1:${DEVOPS_LABS_PORT:-8090}:8080"
    environment:
      - DEVOPS_LABS_LICENSE_KEY=${DEVOPS_LABS_LICENSE_KEY}
    volumes:
      # The API creates and removes lab containers through your Docker engine.
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
      # Share your ghcr.io sign-in so the UI's "Download all for offline" button
      # can pull images with the same token install.sh set up (read-only).
      - ${HOME}/.docker/config.json:/root/.docker/config.json:ro
    restart: unless-stopped

  # Lab images. Pulled on first use; pre-pull with
  # `docker compose --profile images pull` to speed up the first lab start.
  workspace-python:
    image: ghcr.io/limanalhassan/devops-labs-workspace-python:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  workspace-linux:
    image: ghcr.io/limanalhassan/devops-labs-workspace-linux:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  # Docker labs: a workspace with the Docker CLI and the lab's own engine. The engine runs
  # privileged inside the lab and never uses your own Docker's containers or images.
  workspace-docker:
    image: ghcr.io/limanalhassan/devops-labs-workspace-docker:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  docker-engine:
    image: ghcr.io/limanalhassan/devops-labs-docker-engine:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  # Kubernetes labs: a workspace with kubectl and the lab's own one-node cluster (k3s). The cluster
  # runs privileged inside the lab and is removed when the lab ends.
  workspace-kubernetes:
    image: ghcr.io/limanalhassan/devops-labs-workspace-kubernetes:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  k3s-cluster:
    image: ghcr.io/limanalhassan/devops-labs-k3s-cluster:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  # Terraform labs: a workspace with Terraform, OpenTofu and the AWS CLI, and a fake AWS (Moto) that
  # runs in memory. Nothing real is touched and nothing runs privileged.
  workspace-terraform:
    image: ghcr.io/limanalhassan/devops-labs-workspace-terraform:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  aws-emulator:
    image: ghcr.io/limanalhassan/devops-labs-aws-emulator:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  # Gitea sidecar for the Git Level 2 collaboration labs. Only pulled when
  # a lab starts the git profile; customers who stay in Python/Linux never
  # download it.
  gitea-sidecar:
    image: ghcr.io/limanalhassan/devops-labs-gitea-sidecar:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  # Ansible labs: a control node with the ansible-core CLI and three managed
  # nodes reached over SSH.
  workspace-ansible:
    image: ghcr.io/limanalhassan/devops-labs-workspace-ansible:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  ansible-node:
    image: ghcr.io/limanalhassan/devops-labs-ansible-node:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  # Jenkins labs: a Jenkins controller plus a build agent.
  workspace-jenkins:
    image: ghcr.io/limanalhassan/devops-labs-workspace-jenkins:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  jenkins-server:
    image: ghcr.io/limanalhassan/devops-labs-jenkins-server:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  jenkins-agent:
    image: ghcr.io/limanalhassan/devops-labs-jenkins-agent:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  # Prometheus and Grafana labs: the full monitoring stack with a workspace.
  workspace-monitoring:
    image: ghcr.io/limanalhassan/devops-labs-workspace-monitoring:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  monitoring-stack:
    image: ghcr.io/limanalhassan/devops-labs-monitoring-stack:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  monitoring-grafana:
    image: ghcr.io/limanalhassan/devops-labs-monitoring-grafana:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  # Helm labs: a workspace with Helm, a k3s cluster, and a chart repository.
  workspace-helm:
    image: ghcr.io/limanalhassan/devops-labs-workspace-helm:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  k3s-helm:
    image: ghcr.io/limanalhassan/devops-labs-k3s-helm:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  helm-charts:
    image: ghcr.io/limanalhassan/devops-labs-helm-charts:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  # Argo CD labs: a workspace with the argocd CLI and a k3s cluster with Argo CD pre-installed.
  workspace-argocd:
    image: ghcr.io/limanalhassan/devops-labs-workspace-argocd:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  k3s-argocd:
    image: ghcr.io/limanalhassan/devops-labs-k3s-argocd:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

volumes:
  data:
