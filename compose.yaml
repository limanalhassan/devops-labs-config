name: devops-labs

# Customer-facing stack. Pulls prebuilt images from GHCR; no local build.
# To update: `docker compose pull && docker compose up -d`.

services:
  api:
    # Pin to major-version `0` by default. You get patch and minor
    # upgrades automatically with `docker compose pull`, never a surprise
    # major-version break. Switch to a hard pin like `0.1.3` for stricter
    # upgrade control.
    image: ghcr.io/limanalhassan/devops-labs-api:${DEVOPS_LABS_VERSION:-0}
    ports:
      - "127.0.0.1:${DEVOPS_LABS_PORT:-8090}:8080"
    environment:
      - DEVOPS_LABS_LICENSE_KEY=${DEVOPS_LABS_LICENSE_KEY}
    volumes:
      # The API creates and removes lab containers through your Docker engine.
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
    restart: unless-stopped

  # Lab images. Pulled on first use; pre-pull with
  # `docker compose --profile images pull` to speed up the first lab start.
  workspace-python:
    image: ghcr.io/limanalhassan/devops-labs-workspace-python:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

  # Gitea sidecar for the Git Level 2 collaboration labs. Only pulled when
  # a lab starts the git profile; customers who stay in Python/Linux never
  # download it.
  gitea-sidecar:
    image: ghcr.io/limanalhassan/devops-labs-gitea-sidecar:${DEVOPS_LABS_VERSION:-0}
    profiles: [images]

volumes:
  data:
